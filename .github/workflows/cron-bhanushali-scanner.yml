name: cron-bhanushali-scanner

# The 0091 weekly-swing FORWARD-WATCH paper book. A weekly-swing strategy only changes after Friday's
# weekly close, so it runs on its OWN weekly schedule — every Saturday 6 PM IST — not in the daily
# momentum cron. It self-downloads OHLCV, re-runs the 0091 engine from inception, and commits the
# results/*_weekly.* dashboard files. Paper only; never touches the momentum book, the live config, or
# any kill/wall state.
on:
  workflow_dispatch:
    inputs:
      inception:
        description: "weekly-book inception YYYY-MM-DD (clean forward start)"
        default: "2026-07-04"
  schedule:
    - cron: "30 12 * * 6"       # 12:30 UTC Saturday = 18:00 (6 PM) IST Saturday

concurrency:
  group: cron-bhanushali-scanner
  cancel-in-progress: false

permissions:
  contents: write               # commits the weekly paper state back to the repo

jobs:
  weekly:
    name: weekly-swing paper cron (Python 3.12, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Persist the OHLCV cache across runs so the cron does a cheap ~25-day per-ticker TOP-UP instead of
      # re-downloading all ~500 names' full history every week (faster + resilient: a transient yfinance
      # miss falls back to cached bars instead of dropping the name). The key rolls with the month, so the
      # FIRST run each month rebuilds the whole cache clean on one adjustment basis (bounds dividend drift);
      # a rolling per-run suffix + month restore-key makes it a true mutable cache within the month. The
      # cron's corporate-action guard re-fetches any name a split re-adjusted mid-month.
      - name: OHLCV cache key
        id: ohlcvkey
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y-%m-%dT%H%M%S)" >> "$GITHUB_OUTPUT"
      - name: Restore/save OHLCV cache
        uses: actions/cache@v4
        with:
          path: data/ohlcv.pkl
          key: ohlcv-live-${{ steps.ohlcvkey.outputs.month }}-${{ steps.ohlcvkey.outputs.stamp }}
          restore-keys: |
            ohlcv-live-${{ steps.ohlcvkey.outputs.month }}-
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run weekly-swing (0093 + Nifty-50 CRS) paper cron
        run: python scripts/run_bhanushali_cron.py --start "${{ github.event.inputs.inception || '2026-07-04' }}"
      - name: Refresh forward-review scorecard (Oct-1 promote/kill machinery, forward/prereg.md gates)
        run: python scripts/bhanushali_review_scorecard.py
      - name: Archive an immutable snapshot of the record + log recomputation drift
        # Constitution D2: the book is recomputed from inception every run, so the working copy in
        # results/ is MUTABLE — a yfinance revision or a re-adjustment can silently rewrite a past
        # signal/fill. This writes a dated write-once snapshot (book, NAV, ledger, analytics) plus a
        # fingerprint of the inputs (OHLCV/membership/index hashes, engine config), then diffs
        # against the previous snapshot and appends a drift row (restated / vanished / appeared
        # trades, NAV delta). The Oct-1 gates read SNAPSHOTS, not the mutable curve.
        # Must run AFTER the scorecard so the snapshot captures it.
        run: python scripts/archive_weekly_snapshot.py

      - name: Archive issued cards (append-only recommendation record)
        # Non-fatal (the paper state must still publish) but annotated — the append-only card
        # record is the D2 artifact; its absence from the commit is caught by the output contract.
        run: python scripts/archive_weekly_cards.py
          || echo "::warning::card archiver FAILED (exit $?) — results/cards_archive.jsonl not appended this week"
      # The informed-judge stream (pre-reg 0125) is its own workflow since 2026-10-19 (owner option b):
      # .github/workflows/cron-judge.yml, triggered when this one completes, after the week is pushed.
      - name: Log the swing x low-vol blend hybrid (observational WATCHED book, finding 0107)
        # Runs AFTER the swing cron so it uses the freshly-downloaded OHLCV + the just-written swing NAV.
        # Observational only — writes its own results/blend_hybrid_paper.json; never touches the certified
        # paper book / wall. Empty until fresh post-inception bars exist in both sleeves (not an error).
        run: python scripts/run_blend_paper.py --start "${{ github.event.inputs.inception || '2026-07-04' }}"
          || echo "::warning::blend-hybrid paper log FAILED (exit $?) — observational book not updated"
      - name: Log the breadth-50 watched book (EW / SW / SW-accum), observational forward-only (§4)
        # Runs AFTER the swing cron so it uses the freshly-downloaded OHLCV + the engine's committed
        # Nifty-50 CSV (no OI artifact). First tops up delivery (dedups against the committed history)
        # so the recent-week SW/SW-accum tilts are current, then logs the three arms forward-only from
        # the owner-fixed 2026-08-16 inception. Observational: writes only results/breadth50_forward.json,
        # never touches the certified book/wall, and reports NO spread (the seal on the experiment).
        # Empty until fresh post-inception bars exist (not an error). Delivery top-up is non-fatal — a
        # miss just means the newest weeks fall back to the committed delivery (neutral tilt), not a crash.
        # Uses the COMMITTED _delivery_raw.parquet (covers the trailing dlv_med21 / 0139 windows); no
        # weekly scrape (a harvest_delivery top-up here proved fragile and non-essential — recent-week
        # tilts fall back to the committed delivery's staleness cap, which is neutral, not wrong).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download dataset-pin-20260729 --pattern _delivery_raw.parquet --pattern _earnings_raw.parquet --dir data --clobber || echo "::warning::pinned delivery/earnings fetch failed - breadth-50 arms degrade this run"
          python scripts/run_breadth50_paper.py --start "${{ github.event.inputs.breadth50_inception || '2026-08-16' }}" || echo "::warning::breadth-50 forward log FAILED - book not updated"
      - name: Build the per-trade attribution ledger (Satvik Brain Layer 5)
        # Runs AFTER the snapshot + card archivers: it is a deterministic rebuild FROM those immutable
        # archives, so it must see this week's before it runs. MEASUREMENT only — it reads the book and
        # decides nothing. Non-fatal: a collector defect must never withhold the live book.
        run: python scripts/collect_attribution_ledger.py
          || echo "::warning::attribution ledger FAILED (exit $?) - results/attribution_ledger.csv not rebuilt"
      - name: Collect the forward signal-quality table (prereg_signal_quality.md, 4-axis family)
        # Runs AFTER the swing cron so it reads the freshly-committed signal snapshot + history and the
        # fresh OHLCV (so touch_depth Q2 covers the pullback window). BUILD-ONLY and forward-sealed:
        # it joins each signal's quality flags recorded AT signal time to its realized outcome and
        # writes results/signal_quality_forward.csv, reporting only structural coverage and NEVER the
        # axis->outcome relationship (the wall computes that via adjudicate_family). Deterministic
        # rebuild from the immutable archives; non-fatal (a miss just skips this week's table refresh).
        run: python scripts/collect_signal_quality_forward.py
          || echo "::warning::signal-quality collector FAILED (exit $?) - forward table not refreshed this week"
      - name: Render the Saturday post-mortem (B4)
        # Runs LAST among the readers: it consumes the artifacts every earlier step wrote (scorecard,
        # attribution ledger, the book-identity and stop-forensics summaries) and computes nothing of
        # its own. Deterministic and offline — no model call, so it cannot cost anything or drift.
        # Non-fatal ON PURPOSE and unusually so: a REPORTING page must never fail the scan that
        # produced the numbers it reports. Its absence is caught by the output contract instead, where
        # it is conditional for the same reason.
        run: python scripts/render_weekly_postmortem.py
          || echo "::warning::post-mortem render FAILED (exit $?) - this week's page not written"
      - name: Prediction ledger - forecast fresh cards, resolve decided paths
        # B5 producer. One forecast per FRESH card (P(+2R before stop) from the first-passage null),
        # stamped at the card's as-of, plus resolutions for any forecast whose path has decided. Refuses
        # a stale envelope rather than backdating. Non-fatal: a reporting stream must not fail the scan;
        # the hash-chained ledger itself refuses any corrupt append.
        run: python scripts/run_prediction_producer.py
          || echo "::warning::prediction producer FAILED (exit $?) - no forecasts this week"
      - name: Commit weekly paper state
        run: |
          # Author with the owner's GitHub-matched email so Vercel (auto-deploys main) doesn't
          # BLOCK the commit as an unrecognized author.
          git config user.name "kreeshpatel"
          git config user.email "kreeshvasistha@gmail.com"
          # ── GUARD POLICY (fail-loud hardening, 2026-08-05) ──────────────────────────────
          # No `git add ... 2>/dev/null || true`. That construct hid FIVE separate instances of the
          # same defect: `git add` on an ignored-and-untracked path exits 0 and stages nothing, so a
          # green run could publish nothing at all. Required artifacts now go RED BY NAME; optional
          # ones warn. Watchers: tests/test_workflow_output_paths.py (the path can be staged at all)
          # and results/output_contracts.json (the commit actually contained it).
          MISSING=0
          need() { if [ -e "$1" ]; then git add "$1"; else echo "::error::contracted artifact MISSING: $1"; MISSING=1; fi; }
          opt()  { if [ -e "$1" ]; then git add "$1"; else echo "::warning::optional artifact not produced: $1"; fi; }
          git add results/signals_today_weekly.json results/signals_history_weekly.json \
                  results/paper_portfolio_weekly.json results/weekly_review_scorecard.json \
                  results/weekly_sma_panel.csv results/archive results/sma_panel
          need results/portfolio_history_weekly.csv
          need results/base_swing_forward.json   # prereg_swing §4 comparator; §3 forbids backfilling a missed week
          opt results/cards_archive.jsonl
          need results/brain/position_log.csv.gz        # the capital book's holdings; unrecoverable if missed
          need results/brain/management_events.jsonl    # tranches/ratchets/halts; a snapshot cannot rebuild them
          opt results/brain                      # the Saturday post-mortem page (B4); reporting only
          opt results/brain/prediction_ledger.jsonl   # B5 forecasts + resolutions; append-only, hash-chained
          opt results/signal_analytics_weekly.json
          opt results/decision_memos_weekly.json
          opt results/decision_memos_weekly.md
          opt results/blend_hybrid_paper.json
          opt results/breadth50_forward.json   # §4 watched book (EW/SW/SW-accum), observational, forward-only
          opt results/signal_quality_forward.csv  # 4-axis per-signal quality->outcome table (prereg_signal_quality.md)
          opt results/attribution_ledger.csv  # per-trade attribution ledger (Satvik Brain Layer 5)
          # zoo shadow book STOOD DOWN 2026-08-06 (finding 0131, falsifier fired) — no
          # longer produced weekly. The opt() stays so a deliberate manual re-run of
          # scripts/run_zoo_shadow_book.py is still committable; opt() never fails.
          opt results/zoo_shadow_book.json
          if git commit -m "chore(weekly): Saturday weekly-swing paper state $(date -u +%F)"; then
            # --autostash: the OHLCV download leaves UNSTAGED cache changes that abort a plain
            # `git pull --rebase`, which silently swallowed the push as "nothing to push" and dropped
            # the freshly-computed state every week (2026-07-11: 18 signals + 3 holds computed, never
            # published). Autostash + retry publishes it; a persistent failure now exits RED (visible)
            # instead of stranding stale picks on the dashboard.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && { echo "pushed weekly state"; exit $MISSING; }
              echo "push attempt $i failed; retrying in 5s..."; sleep 5
            done
            echo "::error::weekly paper state committed but could NOT be pushed after 3 tries — dashboard is stale"; exit 1
          else
            echo "no state change"
          fi
      # AFTER the commit on purpose. The signal-quality axes are recorded on FRESH cards only, and
      # this archive is written weekly, so a signal that goes FRESH -> ACTIVE between two Saturdays
      # loses them permanently (PHOENIXLTD 2026-08-24 was the first). Raw coverage counts could not
      # show it: `body_ratio: 15/37` reads the same whether the nulls are the documented pre-schema
      # rows or a hole that opened this week.
      #
      # Placed after the publish so a research-collector defect never withholds the LIVE book, and
      # run as its own step so it goes RED rather than joining the collector's non-fatal warning —
      # which is the treatment that let this sit unnoticed. Declared losses in KNOWN_INCOMPLETE stay
      # green; only a NEW one fires.
      - name: Signal-quality axes must not go missing undeclared
        run: python scripts/collect_signal_quality_forward.py --validate
      # AFTER the commit for the same reason as the step above, and it exists for a failure that is
      # already on the record: run_blend_paper.py crashed every Saturday from inception while its step
      # was non-fatal, so the cron stayed green and blend_hybrid_paper.json sat at n_points 0 for about
      # seven weeks. The producers keep their warnings — making one fatal would abort BEFORE the commit
      # and withhold the live book over a side-book defect. This proves the watched books actually
      # advanced to this scan's as-of, and goes RED when one did not.
      - name: Watched-book loggers must have logged this week
        run: python scripts/check_weekly_loggers.py
      # AFTER the commit, read-only. The weekly history is rebuilt from inception every scan, so a
      # universe or logic change can rewrite the past (2026-10-16: ZYDUSWELL displaced HINDZINC, ABDL
      # displaced BANDHANBNK) and the drift log recorded it with nobody reading it. This fails RED on any
      # restated / vanished trade in the latest drift entry that results/history_restatements.json does
      # not declare. Newly closed trades ("appeared") are normal and never fail it.
      - name: History must not change undeclared
        run: python scripts/check_history_drift.py
      # Read-only, after the commit: turns red from 30 days before the NSE holiday calendar runs out, so the
      # next year is loaded in December instead of the engine guessing at holiday-shortened weeks.
      - name: Holiday calendar must not be about to run out
        run: python scripts/check_calendar_coverage.py
