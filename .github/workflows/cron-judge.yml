name: cron-judge

# The informed-judge forward stream (pre-reg 0125), split out of cron-bhanushali-scanner on 2026-10-19
# (owner option b). While it ran inside the scanner job, BEFORE the weekly commit, it destroyed a computed
# week twice (2026-08-08 a bash syntax error; 2026-08-10 a 43m35s hang that hit the job timeout and
# cancelled the commit), and its 10-minute budget then stopped it after 6 of 23 cards on 2026-10-17.
# Raising that budget in place would have reopened the August failure. Run as its own workflow, after the
# scanner has finished and pushed, it can neither withhold nor cancel the weekly state, and the scanner job
# keeps its invariant that the weekly commit is the last step that writes to the repo.
#
# Same instrument as before: same script, same pinned model/effort/prompt/schema (frozen in
# nq/paper/judge.py), same cards (the scanner's just-pushed signals_today_weekly.json), same price cache
# (restored read-only from the scanner's save), same pinned earnings file.

on:
  workflow_run:
    workflows: ["cron-bhanushali-scanner"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cron-judge
  cancel-in-progress: false

permissions:
  contents: write               # commits the hash-chained judge log back to the repo

jobs:
  judge:
    name: informed-judge forward stream (pre-reg 0125, sealed)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main             # the scanner's freshly pushed state, not the commit that triggered it
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: OHLCV cache month
        id: ohlcvkey
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore the scanner's OHLCV cache (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/ohlcv.pkl
          key: ohlcv-live-${{ steps.ohlcvkey.outputs.month }}-none
          restore-keys: |
            ohlcv-live-${{ steps.ohlcvkey.outputs.month }}-
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[judge]"
      - name: Pinned earnings calendar (the judge's event input)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download dataset-pin-20260729 --pattern _earnings_raw.parquet --dir data --clobber || echo "::warning::pinned earnings fetch failed - judge event inputs degrade this run"
      - name: Judge this week's cards
        timeout-minutes: 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set on this runner - judge stream is NOT running."
          fi
          # A literal scalar keeps newlines, so the fallback needs the `\` continuation (2026-08-08).
          python scripts/run_judge_cron.py \
            || echo "::warning::judge cron exited non-zero ($?) - no verdicts appended this week"
      - name: Commit judge verdicts
        run: |
          git config user.name "kreeshpatel"
          git config user.email "kreeshvasistha@gmail.com"
          if [ -e results/judge_log.jsonl ]; then git add results/judge_log.jsonl; fi
          if git diff --cached --quiet; then echo "no new judge verdicts this week"; exit 0; fi
          git commit -m "chore(judge): informed-judge verdicts $(date -u +%F) (pre-reg 0125, sealed)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && { echo "pushed judge verdicts"; exit 0; }
            echo "push attempt $i failed; retrying in 5s..."; sleep 5
          done
          echo "::error::judge verdicts committed but could not be pushed after 3 tries"; exit 1
