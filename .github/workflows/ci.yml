name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['results/**']
  pull_request:
    branches: [main]
    paths-ignore: ['results/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests (Python 3.12, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pin native threading single-threaded — guards against the LightGBM/OpenMP
      # + numpy/pandas BLAS native segfaults seen on this runner class. nq/ has no
      # heavy native ML libs, so this is belt-and-suspenders.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        # Advisory, not a gate — but no longer SILENT: a failure is annotated on the run.
        run: ruff check nq tests || echo "::warning::ruff reported lint findings (advisory gate)"
      - name: Typecheck (mypy --strict)
        # Advisory while the package is young; graduates to a hard gate.
        run: mypy --strict nq || echo "::warning::mypy --strict reported type errors (advisory gate)"
      - name: Tests
        # No --cov (coverage instrumentation segfaulted the old runner).
        run: pytest -v --tb=short

  # ── The product backend ──────────────────────────────────────────────────────
  # A SEPARATE job, not another step, because the two suites cannot share an env: the engine
  # installs `.[dev]` and its pytest run carries `--ignore=dashboard` (pyproject.toml), since the
  # backend has its own config.py shim and import layout. The consequence went unnoticed for a
  # while -- dashboard/backend/tests never ran in CI at all, so every auth guard, tenant-isolation
  # check and reconciliation contract was verified only on whoever's laptop last touched it.
  #
  # Python 3.11 and a plain `-r requirements.txt`, deliberately: that is exactly what ships
  # (dashboard/backend/runtime.txt pins python-3.11.0 and nixpacks.toml installs the same
  # unpinned file), and a test job on a different interpreter than production tests something
  # nobody deploys. The float that requirements.txt allows is fine HERE -- these are API-contract
  # tests, not the engine's byte-sensitive golden master, which is why that suite stays pinned to
  # its own job above.
  backend:
    name: Backend tests (Python 3.11, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dashboard/backend/requirements.txt
      - name: Install
        # pytest and httpx are NOT in requirements.txt and must not be: they are test-only.
        # httpx specifically -- starlette's TestClient needs it, and `pip install fastapi` does
        # not pull it in, so without this every test errors at import with a bare TestClient.
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboard/backend/requirements.txt pytest httpx
      - name: Tests
        # Run from the backend directory, the invocation its own conftest documents. That makes
        # pytest's rootdir dashboard/backend, so the repo-root pyproject (and its
        # --ignore=dashboard) never applies. conftest.py supplies JWT_SECRET, ENCRYPTION_KEY and
        # a sqlite DATABASE_URL, so no secrets are needed here.
        working-directory: dashboard/backend
        run: pytest tests -v --tb=short
