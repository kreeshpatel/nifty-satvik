name: cron-bhanushali-monitor

# Daily OBSERVATIONAL re-pricing of the weekly-swing forward-watch book. The weekly engine only
# recomputes Saturday (cron-bhanushali-scanner.yml), so all week the dashboard's weekly cards carry
# Saturday's price / P&L / distance-to-stop. This job re-prices the FROZEN cards against fresh
# daily bars and flags intra-week events (buy-window fill, stop breach, +2R target, near-stop,
# window-expired) → results/weekly_monitor.json, which the backend overlays onto the cards.
#
# STRICTLY observational — the weekly-book analogue of cron-intraday-scan. It never recomputes the
# weekly signal set (that would risk mid-week signals off a partial weekly bar and break the
# cadence the forward record is certified on), never moves a frozen level, and never touches the
# paper book / NAV / wall log / kill state. Separate output file → no race with the Saturday writer.
on:
  workflow_dispatch: {}          # manual "re-price now"
  schedule:
    - cron: "45 10 * * 1-5"      # 10:45 UTC = 16:15 IST, after the 15:30 NSE close, weekdays

concurrency:
  group: cron-bhanushali-monitor
  cancel-in-progress: false

permissions:
  contents: write                # commits results/weekly_monitor.json
  actions: read                  # scheduler_health reads the Actions run log (S2-F6)

jobs:
  monitor:
    name: weekly-swing daily monitor (Python 3.12, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 — the output-contract checker searches commit HISTORY for each
          # cron's last run. The default depth-1 clone gave it a one-commit repo, so every job
          # read as "no cron commit ever found" and the checker's first CI run was RED against
          # commits that plainly exist on main. Measured cost of full history: 10s, 503 commits,
          # 18 MB — negligible beside this job's OHLCV download. A bounded --deepen was
          # rejected: the answer would then depend on commit VOLUME, which is exactly the kind
          # of silent, drifting dependency S2.14 exists to forbid.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run weekly monitor
        run: python scripts/run_bhanushali_monitor.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # scheduler_health: run-log truth (S2-F6)
      - name: Forward-only accumulators (bulk/block + ratings; owner-signed 2026-07-28)
        # Pure data-collection sidecar - engine untouched, idempotent, staleness-alarmed.
        # Non-fatal by design (the monitor must publish even if the sidecar dies) but NOT silent:
        # a failure is annotated here and the output contract goes red when
        # results/forward_accum_health.json stops appearing in the daily commit.
        run: python scripts/run_forward_accumulators.py
          || echo "::warning::forward accumulators FAILED (exit $?) — health file will go stale; output contract will flag it"
      - name: Commit monitor state
        run: |
          # Author with the owner's GitHub-matched email so Vercel (auto-deploys main) doesn't
          # BLOCK the commit as an unrecognized author.
          git config user.name "kreeshpatel"
          git config user.email "kreeshvasistha@gmail.com"
          # ── GUARD POLICY (fail-loud hardening, 2026-08-05) ──────────────────────────────
          # No `git add ... 2>/dev/null || true`. That construct hid FIVE separate instances of the
          # same defect: `git add` on an ignored-and-untracked path exits 0 and stages nothing, so a
          # green run could publish nothing at all. Required artifacts now go RED BY NAME; optional
          # ones warn. Watchers: tests/test_workflow_output_paths.py (the path can be staged at all)
          # and results/output_contracts.json (the commit actually contained it).
          MISSING=0
          need() { if [ -e "$1" ]; then git add "$1"; else echo "::error::contracted artifact MISSING: $1"; MISSING=1; fi; }
          opt()  { if [ -e "$1" ]; then git add "$1"; else echo "::warning::optional artifact not produced: $1"; fi; }
          git add results/weekly_monitor.json
          need results/forward_accum_health.json
          opt results/bulkblock_forward.csv
          opt results/ratings_forward.csv
          if git commit -m "chore(weekly-monitor): daily re-price $(date -u +%F)"; then
            # --autostash: the OHLCV download leaves unstaged cache changes that abort a plain rebase,
            # which silently swallowed the push and dropped every day's monitor output. Retry + exit RED
            # on persistent failure so a drop is visible, not hidden.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && { echo "pushed monitor state"; exit $MISSING; }
              echo "push attempt $i failed; retrying in 5s..."; sleep 5
            done
            echo "::error::monitor state committed but could NOT be pushed after 3 tries"; exit 1
          else
            echo "no monitor change"
          fi
